name: Build SunoOriginalStudio Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'bootstrap.js'
      - 'main.js'
      - 'suno_session.js'
      - 'auth_fetch_guard.js'
      - 'suno_transport_compat.js'
      - 'deai.js'
      - 'song_library.js'
      - 'song_library_guard.js'
      - 'song_refresh_fix.js'
      - 'suno_library_sync.js'
      - 'preload.js'
      - 'renderer.js'
      - 'account_slots_fix.js'
      - 'batch_renderer.js'
      - 'suno_sync_renderer.js'
      - 'index.html'
      - 'package.json'
      - 'README.md'
      - 'PROJECT_STATUS_AND_AVR_FEATURES.md'
      - 'THIRD_PARTY_N19.md'
      - 'BATCH_EXCEL_V0.5.9.md'
      - 'templates/SunoOriginalStudio批量原创模板_v0.5.8.xlsx'
      - 'templates/README.md'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JavaScript dependencies
        run: npm install

      - name: Verify repository Excel template
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $template = 'templates/SunoOriginalStudio批量原创模板_v0.5.8.xlsx'
          if (-not (Test-Path $template)) { throw "Excel template missing: $template" }
          @'
          const XLSX = require('xlsx');
          const file = 'templates/SunoOriginalStudio批量原创模板_v0.5.8.xlsx';
          const wb = XLSX.readFile(file);
          if (!wb.SheetNames.length) throw new Error('Excel template has no worksheets');
          const first = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(first, { header: 1, defval: '' });
          const expected = ['歌名','歌词','风格','排除风格','模型','人声','Weirdness','风格影响','账号','提交间隔秒','启用'];
          const actual = (rows[0] || []).slice(0, expected.length).map(x => String(x).trim());
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Excel template headers mismatch. expected=${JSON.stringify(expected)} actual=${JSON.stringify(actual)}`);
          }
          if (!wb.SheetNames.includes('填写说明')) throw new Error('Excel template missing 填写说明 worksheet');
          console.log('Excel template verified:', wb.SheetNames.join(', '));
          '@ | node

      - name: Prepare exact AVR N19 toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force vendor/avr-n19/sox | Out-Null

          $ffmpegUrl = 'https://raw.githubusercontent.com/imageio/imageio-binaries/master/ffmpeg/ffmpeg-win-x86_64-v7.1.exe'
          $ffmpegPath = 'vendor/avr-n19/ffmpeg-win-x86_64-v7.1.exe'
          curl.exe -L --fail --retry 4 --retry-delay 2 $ffmpegUrl -o $ffmpegPath
          $ffHash = (Get-FileHash $ffmpegPath -Algorithm SHA256).Hash.ToLower()
          if ($ffHash -ne '2ce797a0f88d7f067180338fb227f7b1928ea727bd9a4d7a1d022f7c52af71a3') {
            throw "AVR FFmpeg hash mismatch: $ffHash"
          }

          $soxZip = Join-Path $env:RUNNER_TEMP 'sox-14.4.2-win32.zip'
          $soxExtract = Join-Path $env:RUNNER_TEMP 'sox-14.4.2-win32'
          curl.exe -L --fail --retry 4 --retry-delay 2 'https://downloads.sourceforge.net/project/sox/sox/14.4.2/sox-14.4.2-win32.zip' -o $soxZip
          Expand-Archive -Path $soxZip -DestinationPath $soxExtract -Force
          $soxExe = Get-ChildItem -Path $soxExtract -Filter sox.exe -Recurse | Select-Object -First 1
          if (-not $soxExe) { throw 'Cannot find sox.exe in official SoX 14.4.2 archive' }
          Copy-Item -Path (Join-Path $soxExe.Directory.FullName '*') -Destination 'vendor/avr-n19/sox' -Recurse -Force

          $expected = @{
            'sox.exe'='e0e3cdc4bcdfbb5b91ac8f53b024964d092f89ba90130ba74b223a1df11b5439';
            'libflac-8.dll'='2c154aeaad085e01361b967adfec84b63db76a82a45681b3e6cdfacb6088e369';
            'libgcc_s_sjlj-1.dll'='2af381dbd5ea1a9a150307b1cba3a150321a3c3ff09fb6ead9bba1e880e03a64';
            'libgomp-1.dll'='9dbbb0cb3f31ded7fbf51141a39578c0bc5cc85b83e9b6908657a6083948b9ba';
            'libid3tag-0.dll'='4ec8e74cdd48a388a41f7f3ab2cea810a1661f47e79b6338192f000341f20af0';
            'libogg-0.dll'='3262325b43b6f249831cc15428372a6daa34cf2459e66ed047dbbd9f00f49378';
            'libpng16-16.dll'='22d46adb7927690eeeb1a27f9544108f7a1c66bf1daec90f3c41aa36e176920d';
            'libsox-3.dll'='240a7e47a4274908786220f1b92372ed1b5f2a1c29874292fad5e64f120d84b4';
            'libssp-0.dll'='113da78ba0514b3947e0988376002c4d5f783d62d5058f99259771648f2e9138';
            'libvorbis-0.dll'='03ae1625a47c1255d70e7d63ee42ef2483c7e2adc9a33d21f45799f323a530b4';
            'libvorbisenc-2.dll'='3b809daf958b6dedeedbe05e91a0ac016b18c871b33dc98c728f8b3440874385';
            'libvorbisfile-3.dll'='1a14d8b0749f66811dacb23b093d54d4ff88036d49fd017b0d98b21de7f9ef1d';
            'libwavpack-1.dll'='9123e73f801629a8791c80d9dc5041ee23f7f1d9ed8510f2f758269159aa26b8';
            'libwinpthread-1.dll'='036af4b9aed20a6bd8b1993f2e0a4789c2ba555c00c0b2d72a6d6a6b8c13ef68';
            'zlib1.dll'='189336a0cf1131d6a681e81b43385ade7252f7211df50774772d8c8ec40d5f8f';
          }
          foreach ($name in $expected.Keys) {
            $p = Join-Path 'vendor/avr-n19/sox' $name
            if (-not (Test-Path $p)) { throw "AVR SoX dependency missing: $name" }
            $actual = (Get-FileHash $p -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected[$name]) { throw "AVR SoX hash mismatch for $name : $actual" }
          }

          $filters = & $ffmpegPath -hide_banner -filters 2>&1 | Out-String
          if ($filters -notmatch 'rubberband') { throw 'Exact AVR FFmpeg does not expose rubberband filter' }
          & 'vendor/avr-n19/sox/sox.exe' --version
          Write-Host 'Exact AVR N19 toolchain verified.'

      - name: Syntax check
        shell: pwsh
        run: |
          $files = @(
            'bootstrap.js',
            'main.js',
            'suno_session.js',
            'auth_fetch_guard.js',
            'suno_transport_compat.js',
            'deai.js',
            'song_library.js',
            'song_library_guard.js',
            'song_refresh_fix.js',
            'suno_library_sync.js',
            'preload.js',
            'renderer.js',
            'account_slots_fix.js',
            'batch_renderer.js',
            'suno_sync_renderer.js'
          )
          foreach ($file in $files) { node --check $file }

      - name: Build portable EXE
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify packaged N19 binaries and EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-Item 'dist\SunoOriginalStudio_v0.5.14.exe'
          if ($exe.Length -lt 100000000) { throw "EXE unexpectedly small for bundled exact N19 toolchain: $($exe.Length)" }

          $packedFfmpeg = 'dist\win-unpacked\resources\tools\n19\ffmpeg-win-x86_64-v7.1.exe'
          $packedSox = 'dist\win-unpacked\resources\tools\n19\sox\sox.exe'
          $ffHash = (Get-FileHash $packedFfmpeg -Algorithm SHA256).Hash.ToLower()
          $soxHash = (Get-FileHash $packedSox -Algorithm SHA256).Hash.ToLower()
          if ($ffHash -ne '2ce797a0f88d7f067180338fb227f7b1928ea727bd9a4d7a1d022f7c52af71a3') { throw "Packaged FFmpeg was modified by packaging/signing: $ffHash" }
          if ($soxHash -ne 'e0e3cdc4bcdfbb5b91ac8f53b024964d092f89ba90130ba74b223a1df11b5439') { throw "Packaged SoX was modified by packaging/signing: $soxHash" }
          $filters = & $packedFfmpeg -hide_banner -filters 2>&1 | Out-String
          if ($filters -notmatch 'rubberband') { throw 'Packaged FFmpeg lost rubberband filter' }
          Write-Host "Built:" $exe.FullName $exe.Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SunoOriginalStudio_v0.5.14_Windows
          path: dist/SunoOriginalStudio_v0.5.14.exe
          if-no-files-found: error

      - name: Publish prerelease
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: suno-original-studio-v0.5.14
          name: Suno Original Studio v0.5.14
          prerelease: true
          make_latest: true
          files: dist/SunoOriginalStudio_v0.5.14.exe
          body: |
            v0.5.14 fixes packaged internal version display by reading Electron app.getVersion() through IPC, restores preload initialization/account slots, retains the verified current Suno WAV download flow and detailed diagnostics, and leaves the exact AVR N19 pipeline unchanged.
