name: Build SunoOriginalStudio Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'main.js'
      - 'preload.js'
      - 'renderer.js'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report build started
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build_status | Out-Null
          @"
          status=started
          run_id=${{ github.run_id }}
          artifact=SunoOriginalStudio_v0.2.0_Windows
          exe=SunoOriginalStudio_v0.2.0.exe
          source_sha=${{ github.sha }}
          "@ | Set-Content -Encoding UTF8 build_status/suno_original_studio.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_status/suno_original_studio.txt
          git commit -m "Start SunoOriginalStudio build ${{ github.run_id }}" || exit 0
          git push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install

      - name: Syntax check
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer.js

      - name: Build portable EXE
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = Get-Item 'dist\SunoOriginalStudio_v0.2.0.exe'
          if ($exe.Length -lt 50000000) { throw "EXE unexpectedly small: $($exe.Length)" }
          Write-Host "Built:" $exe.FullName $exe.Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SunoOriginalStudio_v0.2.0_Windows
          path: dist/SunoOriginalStudio_v0.2.0.exe
          if-no-files-found: error

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: suno-original-studio-v0.2.0
          name: Suno Original Studio v0.2.0
          prerelease: true
          make_latest: false
          files: dist/SunoOriginalStudio_v0.2.0.exe
          body: |
            Adds the official Suno human-verification handoff for original-song generation.
            Supports hCaptcha and Cloudflare Turnstile according to Suno captcha_version.
            The application does not solve or bypass CAPTCHA; the official challenge is completed in the user's own Suno session and the returned token is used to resume the pending request.

      - name: Report successful build
        shell: pwsh
        run: |
          git pull --rebase
          @"
          status=success
          run_id=${{ github.run_id }}
          artifact=SunoOriginalStudio_v0.2.0_Windows
          exe=SunoOriginalStudio_v0.2.0.exe
          source_sha=${{ github.sha }}
          "@ | Set-Content -Encoding UTF8 build_status/suno_original_studio.txt
          git add build_status/suno_original_studio.txt
          git commit -m "Finish SunoOriginalStudio build ${{ github.run_id }}" || exit 0
          git push
