name: Build SunoOriginalStudio Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'bootstrap.js'
      - 'main.js'
      - 'deai.js'
      - 'preload.js'
      - 'renderer.js'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report build started
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build_status | Out-Null
          @"
          status=started
          run_id=${{ github.run_id }}
          artifact=SunoOriginalStudio_v0.3.0_Windows
          exe=SunoOriginalStudio_v0.3.0.exe
          source_sha=${{ github.sha }}
          "@ | Set-Content -Encoding UTF8 build_status/suno_original_studio.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_status/suno_original_studio.txt
          git commit -m "Start SunoOriginalStudio build ${{ github.run_id }}" || exit 0
          git push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install

      - name: Syntax check
        shell: pwsh
        run: |
          node --check bootstrap.js
          node --check main.js
          node --check deai.js
          node --check preload.js
          node --check renderer.js

      - name: Verify bundled FFmpeg
        shell: pwsh
        run: |
          node -e "const p=require('ffmpeg-static'); const fs=require('fs'); if(!p || !fs.existsSync(p)) throw new Error('ffmpeg-static missing: '+p); console.log('FFmpeg:', p)"

      - name: Build portable EXE
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = Get-Item 'dist\SunoOriginalStudio_v0.3.0.exe'
          if ($exe.Length -lt 70000000) { throw "EXE unexpectedly small: $($exe.Length)" }
          Write-Host "Built:" $exe.FullName $exe.Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SunoOriginalStudio_v0.3.0_Windows
          path: dist/SunoOriginalStudio_v0.3.0.exe
          if-no-files-found: error

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: suno-original-studio-v0.3.0
          name: Suno Original Studio v0.3.0
          prerelease: true
          make_latest: false
          files: dist/SunoOriginalStudio_v0.3.0.exe
          body: |
            Integrates the N19-compatible AI trace cleaner into SunoOriginalStudio.
            Adds multi-file audio selection, configurable output directory, sequential batch processing,
            cancellation, output-folder opening, metadata removal, and 48 kHz PCM16 WAV output.
            Uses bundled FFmpeg and preserves the existing Suno original-generation and official verification flow.

      - name: Report successful build
        shell: pwsh
        run: |
          git pull --rebase
          @"
          status=success
          run_id=${{ github.run_id }}
          artifact=SunoOriginalStudio_v0.3.0_Windows
          exe=SunoOriginalStudio_v0.3.0.exe
          source_sha=${{ github.sha }}
          "@ | Set-Content -Encoding UTF8 build_status/suno_original_studio.txt
          git add build_status/suno_original_studio.txt
          git commit -m "Finish SunoOriginalStudio build ${{ github.run_id }}" || exit 0
          git push
